<title>Interval Timer</title>
<style>
  :root{
    --bg:#12151b;
    --surface:#1b1f27;
    --surface-2:#232833;
    --text:#f2f0ea;
    --text-dim:#8b93a1;
    --work:#ff6a3d;
    --rest:#2fb8ac;
    --prep:#6c7ce0;
    --idle:#8b93a1;
    --ring-track:#262b34;
    --phase: var(--idle);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior:none;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }
  #app[data-phase="work"]{ --phase: var(--work); }
  #app[data-phase="rest"]{ --phase: var(--rest); }
  #app[data-phase="prep"]{ --phase: var(--prep); }
  #app[data-phase="idle"], #app[data-phase="done"]{ --phase: var(--idle); }
  #app{
    height:100%;
    display:flex; flex-direction:column;
    padding: calc(var(--safe-top) + 14px) 18px calc(var(--safe-bottom) + 18px);
    transition: background 0.4s ease;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    flex:0 0 auto;
  }
  header h1{
    font-size:15px; font-weight:600; letter-spacing:0.2px; color:var(--text-dim);
    margin:0;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:12px;
    background:var(--surface); border:none; color:var(--text);
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
  }
  .icon-btn.active{ color:var(--phase); }
  main{
    flex:1 1 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    min-height:0;
  }
  .phase-label{
    font-size:clamp(18px,5vw,22px); font-weight:600; color:var(--phase);
    transition: color 0.3s ease;
    height:28px;
  }
  .ring-wrap{
    position:relative;
    width:min(72vw, 320px); height:min(72vw, 320px);
    margin:8px 0;
  }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--ring-track); stroke-width:14; }
  .ring-progress{
    fill:none; stroke:var(--phase); stroke-width:14; stroke-linecap:round;
    transition: stroke 0.3s ease;
  }
  .time-display{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .time{
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size:clamp(52px, 16vw, 76px); font-weight:600; line-height:1;
    letter-spacing: -1px;
  }
  .round-label{
    font-size:14px; color:var(--text-dim); margin-top:6px;
  }
  .controls{
    display:flex; align-items:center; justify-content:center; gap:22px;
    flex:0 0 auto; margin-top:4px;
  }
  .btn-reset, .btn-skip{
    width:52px; height:52px; border-radius:50%;
    background:var(--surface); border:none; color:var(--text-dim);
    font-size:13px; font-weight:600;
  }
  .btn-main{
    width:84px; height:84px; border-radius:50%;
    background:var(--phase); border:none; color:#12151b;
    font-size:16px; font-weight:700;
    transition: background 0.3s ease;
  }
  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    padding:10px 18px calc(var(--safe-bottom) + 22px);
    transform: translateY(100%);
    transition: transform 0.28s ease;
    max-height:78vh; overflow-y:auto;
    -webkit-overflow-scrolling: touch;
  }
  .sheet.open{ transform: translateY(0); }
  .sheet-handle{
    width:36px; height:4px; border-radius:2px; background:var(--ring-track);
    margin:6px auto 14px;
  }
  .sheet h2{ font-size:16px; margin:0 0 12px; font-weight:600; }
  .presets{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:14px;
  }
  .chip{
    flex:0 0 auto;
    background:var(--surface-2); color:var(--text);
    border:none; border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600;
    white-space:nowrap;
    position:relative;
  }
  .chip.custom, .chip.builtin{ padding-right:30px; }
  .chip.custom .del, .chip.builtin .del{
    position:absolute; right:5px; top:50%; transform:translateY(-50%);
    width:19px; height:19px; border-radius:50%;
    background:rgba(0,0,0,0.28); border:none; color:var(--text);
    font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .chip.add-chip{
    background:transparent; border:1.5px dashed var(--text-dim); color:var(--text-dim);
  }
  .save-row{
    padding-bottom:14px; margin-bottom:6px; border-bottom:1px solid var(--surface-2);
  }
  .save-form{ display:flex; gap:8px; }
  .save-form input{
    flex:1; min-width:0; background:var(--surface-2); border:none; border-radius:10px;
    padding:11px 12px; color:var(--text); font-size:14px;
  }
  .save-form input::placeholder{ color:var(--text-dim); }
  .save-form button{
    padding:11px 14px; border-radius:10px; border:none; font-weight:600; font-size:14px; flex:0 0 auto;
  }
  .save-form .confirm{ background:var(--work); color:#12151b; }
  .save-form .cancel{ background:var(--surface-2); color:var(--text); }
  .hint{ font-size:11px; color:var(--text-dim); margin:-10px 0 12px; }
  .stepper-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0; border-bottom:1px solid var(--surface-2);
  }
  .stepper-row:last-of-type{ border-bottom:none; }
  .stepper-row .label{ font-size:15px; font-weight:500; }
  .stepper-row .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .stepper{
    display:flex; align-items:center; gap:12px;
  }
  .stepper button{
    width:44px; height:44px; border-radius:12px;
    background:var(--surface-2); border:none; color:var(--text);
    font-size:22px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .stepper .val{
    min-width:56px; text-align:center; font-size:16px; font-weight:600;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums;
  }
  .sheet-actions{
    display:flex; gap:10px; margin-top:16px;
  }
  .sheet-actions button{
    flex:1; padding:13px; border-radius:14px; border:none;
    font-size:15px; font-weight:600;
  }
  .sheet-actions .close{ background:var(--surface-2); color:var(--text); }
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transition:opacity 0.28s ease;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app" data-phase="idle">
  <header>
    <h1 id="headerTitle">Interval Timer</h1>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" id="voiceBtn" title="Voice cues">🔊</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </header>
  <main>
    <div class="phase-label" id="phaseLabel">Ready</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 300 300">
        <circle class="ring-track" cx="150" cy="150" r="130"></circle>
        <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="130"
                stroke-dasharray="816.8" stroke-dashoffset="0"></circle>
      </svg>
      <div class="time-display">
        <div class="time" id="timeDisplay">00:20</div>
      </div>
    </div>
    <div class="round-label" id="roundLabel">8 rounds · 20s / 10s</div>
  </main>
  <div class="controls">
    <button class="btn-reset" id="resetBtn">Reset</button>
    <button class="btn-main" id="mainBtn">Start</button>
    <button class="btn-skip" id="skipBtn">Skip</button>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h2>Set up your interval</h2>
  <div class="presets" id="presets">
    <span id="builtinPresets" style="display:contents;"></span>
    <span id="customPresets" style="display:contents;"></span>
    <button class="chip add-chip" id="savePresetBtn">+ Save current</button>
  </div>
  <div class="save-row hidden" id="saveRow">
    <div class="save-form">
      <input type="text" id="presetNameInput" placeholder="e.g. Shoulders, Back day" maxlength="24">
      <button class="cancel" id="cancelSave">Cancel</button>
      <button class="confirm" id="confirmSave">Save</button>
    </div>
    <div class="hint">Saves prep/work/rest/rounds as a routine you can reuse.</div>
  </div>
  <div class="stepper-row">
    <div><div class="label">Get ready</div><div class="sub">Countdown before it starts</div></div>
    <div class="stepper">
      <button data-field="prep" data-dir="-1">−</button>
      <span class="val" id="prepVal">5s</span>
      <button data-field="prep" data-dir="1">+</button>
    </div>
  </div>
  <div class="stepper-row">
    <div><div class="label">Work</div><div class="sub">Active interval length</div></div>
    <div class="stepper">
      <button data-field="work" data-dir="-1">−</button>
      <span class="val" id="workVal">20s</span>
      <button data-field="work" data-dir="1">+</button>
    </div>
  </div>
  <div class="stepper-row">
    <div><div class="label">Rest</div><div class="sub">Between rounds (0 = none)</div></div>
    <div class="stepper">
      <button data-field="rest" data-dir="-1">−</button>
      <span class="val" id="restVal">10s</span>
      <button data-field="rest" data-dir="1">+</button>
    </div>
  </div>
  <div class="stepper-row">
    <div><div class="label">Rounds</div><div class="sub">Total work intervals</div></div>
    <div class="stepper">
      <button data-field="rounds" data-dir="-1">−</button>
      <span class="val" id="roundsVal">8</span>
      <button data-field="rounds" data-dir="1">+</button>
    </div>
  </div>
  <div class="sheet-actions">
    <button class="close" id="closeSheet">Close</button>
  </div>
</div>
<script>
(function(){
  const app = document.getElementById('app');
  const phaseLabel = document.getElementById('phaseLabel');
  const timeDisplay = document.getElementById('timeDisplay');
  const roundLabel = document.getElementById('roundLabel');
  const ringProgress = document.getElementById('ringProgress');
  const mainBtn = document.getElementById('mainBtn');
  const resetBtn = document.getElementById('resetBtn');
  const skipBtn = document.getElementById('skipBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const closeSheet = document.getElementById('closeSheet');
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('backdrop');
  const voiceBtn = document.getElementById('voiceBtn');
  const CIRC = 2 * Math.PI * 130;

  let settings = { prep: 5, work: 20, rest: 10, rounds: 8 };
  // Special mode for complex Tabata (4 cycles × 5 rounds)
  let specialMode = null; // null | 'tabata4x5'

  const limits = {
    prep:  {min:0, max:30, step:1},
    work:  {min:5, max:600, step:1},
    rest:  {min:0, max:300, step:1},
    rounds:{min:1, max:50, step:1}
  };

  function fmtSetting(field, v){ return field === 'rounds' ? String(v) : v + 's'; }

  function refreshSettingUI(){
    document.getElementById('prepVal').textContent = fmtSetting('prep', settings.prep);
    document.getElementById('workVal').textContent = fmtSetting('work', settings.work);
    document.getElementById('restVal').textContent = fmtSetting('rest', settings.rest);
    document.getElementById('roundsVal').textContent = fmtSetting('rounds', settings.rounds);

    if(specialMode === 'tabata4x5'){
      roundLabel.textContent = '4×5 · 20s work / 5s rest (+10s between cycles)';
    } else {
      roundLabel.textContent = settings.rounds + (settings.rounds===1 ? ' round · ' : ' rounds · ') +
        settings.work + 's' + (settings.rest>0 ? ' / ' + settings.rest + 's' : '');
    }
  }

  document.querySelectorAll('.stepper button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      // Changing any stepper cancels special mode
      specialMode = null;
      const field = btn.dataset.field;
      const dir = parseInt(btn.dataset.dir,10);
      const L = limits[field];
      let v = settings[field] + dir*L.step;
      v = Math.max(L.min, Math.min(L.max, v));
      settings[field] = v;
      refreshSettingUI();
      if(state.mode === 'idle') resetDisplayToIdle();
      scheduleSaveLastSettings();
    });
  });

  const BUILTIN_PRESETS = [
    {
      id:'tabata',
      name:'Tabata · 4×5 (20/5)',
      prep:5, work:20, rest:5, rounds:20,
      special: 'tabata4x5'
    },
    {id:'hiit',     name:'HIIT · 40/20 ×10',    prep:10, work:40, rest:20, rounds:10},
    {id:'strength', name:'Strength · 45/15 ×6', prep:10, work:45, rest:15, rounds:6},
    {id:'stretch',  name:'Stretch hold · 30s ×12', prep:5, work:30, rest:0, rounds:12}
  ];

  function applyRoutine(p){
    settings = { prep:p.prep, work:p.work, rest:p.rest, rounds:p.rounds };
    specialMode = p.special || null;
    refreshSettingUI();
    if(state.mode === 'idle') resetDisplayToIdle();
    scheduleSaveLastSettings();
  }

  document.getElementById('presets').addEventListener('click', (e)=>{
    if(e.target.closest('#savePresetBtn')) return;
    const delBtn = e.target.closest('.del');
    if(delBtn){
      if(delBtn.dataset.kind === 'builtin') deleteBuiltinPreset(delBtn.dataset.id);
      else deleteCustomPreset(delBtn.dataset.id);
      return;
    }
    const customChip = e.target.closest('.chip.custom');
    if(customChip){
      const p = customPresets.find(x => x.id === customChip.dataset.id);
      if(p) applyRoutine(p);
      return;
    }
    const builtinChip = e.target.closest('.chip.builtin');
    if(builtinChip){
      const p = BUILTIN_PRESETS.find(x => x.id === builtinChip.dataset.id);
      if(p) applyRoutine(p);
    }
  });

  // ---- storage ----
  const CUSTOM_KEY = 'custom-routines';
  const HIDDEN_KEY = 'hidden-builtin-routines';
  const LAST_KEY = 'last-used-settings';
  let customPresets = [];
  let hiddenBuiltins = [];
  let storageAvailable = !!(window.storage && window.storage.get && window.storage.set);

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  async function loadCustomPresets(){
    if(!storageAvailable) return;
    try{
      const res = await window.storage.get(CUSTOM_KEY, false);
      customPresets = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ customPresets = []; }
  }
  async function persistCustomPresets(){
    if(!storageAvailable) return;
    try{ await window.storage.set(CUSTOM_KEY, JSON.stringify(customPresets), false); }catch(e){}
  }
  async function loadHiddenBuiltins(){
    if(!storageAvailable) return;
    try{
      const res = await window.storage.get(HIDDEN_KEY, false);
      hiddenBuiltins = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ hiddenBuiltins = []; }
  }
  async function persistHiddenBuiltins(){
    if(!storageAvailable) return;
    try{ await window.storage.set(HIDDEN_KEY, JSON.stringify(hiddenBuiltins), false); }catch(e){}
  }
  let lastSettingsTimer = null;
  function scheduleSaveLastSettings(){
    if(!storageAvailable) return;
    clearTimeout(lastSettingsTimer);
    lastSettingsTimer = setTimeout(async ()=>{
      try{ await window.storage.set(LAST_KEY, JSON.stringify({...settings, specialMode}), false); }catch(e){}
    }, 350);
  }
  async function loadLastSettings(){
    if(!storageAvailable) return;
    try{
      const res = await window.storage.get(LAST_KEY, false);
      if(res && res.value){
        const s = JSON.parse(res.value);
        for(const f of ['prep','work','rest','rounds']){
          if(typeof s[f] === 'number'){
            const L = limits[f];
            settings[f] = Math.max(L.min, Math.min(L.max, s[f]));
          }
        }
        if(s.specialMode) specialMode = s.specialMode;
      }
    }catch(e){}
  }

  function renderBuiltinPresets(){
    const container = document.getElementById('builtinPresets');
    container.innerHTML = '';
    BUILTIN_PRESETS.filter(p => !hiddenBuiltins.includes(p.id)).forEach(p=>{
      const btn = document.createElement('button');
      btn.className = 'chip builtin';
      btn.dataset.id = p.id;
      btn.innerHTML = escapeHtml(p.name) + '<span class="del" data-kind="builtin" data-id="'+p.id+'">×</span>';
      container.appendChild(btn);
    });
  }
  function deleteBuiltinPreset(id){
    if(!hiddenBuiltins.includes(id)) hiddenBuiltins.push(id);
    renderBuiltinPresets();
    persistHiddenBuiltins();
  }
  function renderCustomPresets(){
    const container = document.getElementById('customPresets');
    container.innerHTML = '';
    customPresets.forEach(p=>{
      const btn = document.createElement('button');
      btn.className = 'chip custom';
      btn.dataset.id = p.id;
      btn.innerHTML = escapeHtml(p.name) + '<span class="del" data-kind="custom" data-id="'+p.id+'">×</span>';
      container.appendChild(btn);
    });
  }
  function deleteCustomPreset(id){
    customPresets = customPresets.filter(p => p.id !== id);
    renderCustomPresets();
    persistCustomPresets();
  }

  const saveRow = document.getElementById('saveRow');
  const presetNameInput = document.getElementById('presetNameInput');
  document.getElementById('savePresetBtn').addEventListener('click', ()=>{
    saveRow.classList.remove('hidden');
    presetNameInput.value = '';
    presetNameInput.focus();
  });
  document.getElementById('cancelSave').addEventListener('click', ()=>{
    saveRow.classList.add('hidden');
  });
  document.getElementById('confirmSave').addEventListener('click', confirmSaveRoutine);
  presetNameInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') confirmSaveRoutine(); });
  function confirmSaveRoutine(){
    const name = presetNameInput.value.trim();
    if(!name) return;
    customPresets.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      name: name.slice(0,24),
      prep: settings.prep, work: settings.work, rest: settings.rest, rounds: settings.rounds
    });
    renderCustomPresets();
    persistCustomPresets();
    saveRow.classList.add('hidden');
  }

  settingsBtn.addEventListener('click', ()=>{ sheet.classList.add('open'); backdrop.classList.add('open'); });
  closeSheet.addEventListener('click', closeSettings);
  backdrop.addEventListener('click', closeSettings);
  function closeSettings(){ sheet.classList.remove('open'); backdrop.classList.remove('open'); }

  // ---- voice ----
  let voiceOn = true;
  voiceBtn.classList.add('active');
  voiceBtn.addEventListener('click', ()=>{
    voiceOn = !voiceOn;
    voiceBtn.classList.toggle('active', voiceOn);
    voiceBtn.textContent = voiceOn ? '🔊' : '🔇';
    if(!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
  });
  function speak(text){
    if(!voiceOn || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.pitch = 1.0; u.volume = 1.0;
    window.speechSynthesis.speak(u);
  }

  // ---- beeps ----
  let audioCtx = null;
  function ensureAudio(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } }
  function beep(freq, dur, when=0){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime + when;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.5, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function tickBeep(){ beep(880, 0.08); }
  function transitionBeep(){ beep(660,0.09,0); beep(990,0.12,0.11); }
  function finishBeep(){ beep(880,0.15,0); beep(1175,0.15,0.16); beep(1568,0.22,0.32); }

  // ---- wake lock ----
  let wakeLock = null;
  async function requestWakeLock(){
    try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){}
  }
  function releaseWakeLock(){ if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; } }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && state.mode === 'running') requestWakeLock();
  });

  // ---- timer engine ----
  let state = { mode:'idle', phases:[], idx:-1, endTs:0, remaining:0, lastTickSecond:null, pausedRemaining:null };
  let rafId = null;

  function buildPhases(){
    const p = [];
    if(settings.prep > 0) p.push({type:'prep', dur:settings.prep});

    if(specialMode === 'tabata4x5'){
      // 4 cycles × 5 rounds of 20s work / 5s rest, with 10s rest between cycles
      let roundNum = 0;
      for(let cycle = 1; cycle <= 4; cycle++){
        for(let r = 1; r <= 5; r++){
          roundNum++;
          p.push({type:'work', dur:20, round:roundNum, cycle:cycle});
          if(r < 5){
            // short rest inside the cycle
            p.push({type:'rest', dur:5, round:roundNum, cycle:cycle});
          } else if(cycle < 4){
            // longer rest between cycles
            p.push({type:'rest', dur:10, round:roundNum, cycle:cycle, long:true});
          }
        }
      }
    } else {
      // Normal simple mode
      for(let i=1; i<=settings.rounds; i++){
        p.push({type:'work', dur:settings.work, round:i});
        if(settings.rest > 0 && i < settings.rounds){
          p.push({type:'rest', dur:settings.rest, round:i});
        }
      }
    }
    return p;
  }

  function phaseWord(type){
    return type==='prep' ? 'Get ready' : type==='work' ? 'Work' : type==='rest' ? 'Rest' : 'Done';
  }

  function resetDisplayToIdle(){
    app.dataset.phase = 'idle';
    phaseLabel.textContent = 'Ready';
    const dur = settings.prep>0 ? settings.prep : settings.work;
    timeDisplay.textContent = fmtTime(dur);
    ringProgress.style.strokeDasharray = CIRC;
    ringProgress.style.strokeDashoffset = 0;
    mainBtn.textContent = 'Start';
    refreshSettingUI();
  }

  function fmtTime(sec){
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function startTimer(){
    ensureAudio();
    if(state.mode === 'idle' || state.mode === 'done'){
      state.phases = buildPhases();
      state.idx = -1;
      goToNextPhase();
    } else if(state.mode === 'paused'){
      state.endTs = Date.now() + state.pausedRemaining;
      state.mode = 'running';
    }
    requestWakeLock();
    mainBtn.textContent = 'Pause';
    loop();
  }

  function pauseTimer(){
    state.mode = 'paused';
    state.pausedRemaining = state.endTs - Date.now();
    mainBtn.textContent = 'Resume';
    if(rafId) cancelAnimationFrame(rafId);
    releaseWakeLock();
  }

  function resetTimer(){
    state.mode = 'idle';
    if(rafId) cancelAnimationFrame(rafId);
    releaseWakeLock();
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    resetDisplayToIdle();
  }

  function skipPhase(){
    if(state.mode !== 'running' && state.mode !== 'paused') return;
    goToNextPhase();
    if(state.mode !== 'done'){
      state.mode = 'running';
      mainBtn.textContent = 'Pause';
      requestWakeLock();
      loop();
    }
  }

  function goToNextPhase(){
    state.idx++;
    if(state.idx >= state.phases.length){ finishAll(); return; }
    const ph = state.phases[state.idx];
    state.mode = 'running';
    state.endTs = Date.now() + ph.dur*1000;
    state.lastTickSecond = null;
    app.dataset.phase = ph.type;
    phaseLabel.textContent = phaseWord(ph.type);

    if(ph.round){
      if(specialMode === 'tabata4x5' && ph.cycle){
        roundLabel.textContent = 'Cycle ' + ph.cycle + ' · Round ' + ((ph.round-1)%5 + 1) + ' of 5';
      } else {
        roundLabel.textContent = 'Round ' + ph.round + ' of ' + settings.rounds;
      }
    } else if(ph.type === 'prep'){
      roundLabel.textContent = 'Starting soon';
    } else {
      roundLabel.textContent = '';
    }

    transitionBeep();
    if(ph.type === 'prep') speak('Get ready');
    else if(ph.type === 'work') speak(ph.round ? ('Go, round ' + ph.round) : 'Go');
    else speak(ph.long ? 'Long rest' : 'Rest');
  }

  function finishAll(){
    state.mode = 'done';
    app.dataset.phase = 'done';
    phaseLabel.textContent = 'Done';
    timeDisplay.textContent = '00:00';
    const totalRounds = specialMode === 'tabata4x5' ? 20 : settings.rounds;
    roundLabel.textContent = 'Nice work — ' + totalRounds + ' rounds complete';
    ringProgress.style.strokeDashoffset = 0;
    mainBtn.textContent = 'Start';
    finishBeep();
    speak('Workout complete');
    releaseWakeLock();
    if(rafId) cancelAnimationFrame(rafId);
  }

  function loop(){
    if(state.mode !== 'running'){ return; }
    const ph = state.phases[state.idx];
    const remainingMs = state.endTs - Date.now();
    const remainingSec = remainingMs/1000;
    timeDisplay.textContent = fmtTime(remainingSec);
    const frac = Math.max(0, Math.min(1, remainingMs / (ph.dur*1000)));
    ringProgress.style.strokeDasharray = CIRC;
    ringProgress.style.strokeDashoffset = CIRC * (1 - frac);
    const wholeSecLeft = Math.ceil(remainingSec);
    if(wholeSecLeft <= 3 && wholeSecLeft >= 1 && wholeSecLeft !== state.lastTickSecond){
      state.lastTickSecond = wholeSecLeft;
      tickBeep();
    }
    if(remainingMs <= 0){
      goToNextPhase();
    }
    if(state.mode === 'running'){
      rafId = requestAnimationFrame(loop);
    }
  }

  mainBtn.addEventListener('click', ()=>{
    if(state.mode === 'running') pauseTimer();
    else startTimer();
  });
  resetBtn.addEventListener('click', resetTimer);
  skipBtn.addEventListener('click', skipPhase);

  async function init(){
    await Promise.all([loadLastSettings(), loadHiddenBuiltins(), loadCustomPresets()]);
    renderBuiltinPresets();
    renderCustomPresets();
    refreshSettingUI();
    resetDisplayToIdle();
  }
  init();
})();
</script>
</body>
</html>
